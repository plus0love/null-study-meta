<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Null Study Meta — 우리의 스터디룸</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ctext y=%2726%27 font-size=%2726%27%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- 라인 아이콘 (stroke 기반, currentColor) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20V2H6.5A2.5 2.5 0 0 0 4 4.5z"/></symbol>
      <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4zM6 1v3M10 1v3M14 1v3"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M1 6v16l7-4 8 4 7-4V2l-7 4-8-4z M8 2v16M16 6v16"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="m1 1 22 22M16.7 11.1a10 10 0 0 1 2.1 1.6M5 12.6a10 10 0 0 1 5.2-2.7M10.7 5.1a16 16 0 0 1 11.3 3.6M1.4 8.7a16 16 0 0 1 4.4-3M8.5 16.4a5 5 0 0 1 7 0M12 20h.01"/></symbol>
    </defs>
  </svg>

  <div id="stage">
    <div id="game"></div>
    <div id="vignette"></div>

    <div id="hud-tl">
      <div id="room-name" class="badge">우리의 스터디룸</div>
      <div id="room-count" class="badge badge-count"><svg class="icon"><use href="#i-users"/></svg><span>0</span></div>
    </div>

    <div id="hud-tr">
      <button class="icon-btn" id="btn-settings" title="설정" aria-label="설정"><svg class="icon"><use href="#i-settings"/></svg></button>
      <button class="icon-btn" id="btn-members" title="멤버" aria-label="멤버"><svg class="icon"><use href="#i-users"/></svg></button>
      <button class="icon-btn" id="btn-notify" title="알림" aria-label="알림"><svg class="icon"><use href="#i-bell"/></svg><span class="dot" id="notify-dot" hidden></span></button>
      <button class="icon-btn danger" id="btn-leave" title="나가기" aria-label="나가기"><svg class="icon"><use href="#i-logout"/></svg></button>

      <div class="popover" id="pop-settings" hidden>
        <h3>설정</h3>
        <div class="field">
          <label>아바타 셔츠 색</label>
          <div class="swatches" id="settings-avatars"></div>
        </div>
        <div class="field">
          <label>닉네임</label>
          <div class="row"><span id="settings-nick" class="mono"></span><button class="btn small ghost" id="btn-rename">변경 (재입장)</button></div>
        </div>
        <form class="field" id="npc-name-form" autocomplete="off">
          <label for="npc-name">강아지 이름 (모두에게 적용)</label>
          <div class="row"><input id="npc-name" type="text" maxlength="8" placeholder="사랑" /><button class="btn small" type="submit">저장</button></div>
        </form>
        <p class="hint">이동 방향키/WASD · 앉기/쓰다듬기 E · 채팅 Enter · 이모지 1~6</p>
      </div>
      <div class="popover" id="pop-members" hidden>
        <h3>멤버 <span class="muted" id="members-count"></span></h3>
        <ul class="list" id="members-list"></ul>
      </div>
      <div class="popover" id="pop-notify" hidden>
        <h3>알림</h3>
        <ul class="list" id="notify-list"><li class="muted">아직 알림이 없어요.</li></ul>
      </div>
    </div>

    <div id="hud-bl">
      <div class="bar" id="emoji-bar"></div>
      <div class="bar" id="status-bar">
        <button class="btn status" id="btn-status" title="상태 전환"><svg class="icon"><use href="#i-coffee"/></svg><span>휴식 중</span></button>
        <span class="hint-key" id="sit-hint" hidden><kbd>E</kbd><span>앉기</span></span>
      </div>
    </div>

    <div id="banner-offline" hidden><svg class="icon"><use href="#i-wifi-off"/></svg><span>재접속 중…</span></div>
  </div>

  <aside id="sidebar">
    <section class="card" id="card-minimap">
      <header><svg class="icon"><use href="#i-map"/></svg><h2>미니맵</h2></header>
      <canvas id="minimap" width="322" height="238"></canvas>
    </section>

    <section class="card" id="card-todo">
      <header><svg class="icon"><use href="#i-check"/></svg><h2>오늘의 할 일</h2><span class="muted" id="todo-count"></span></header>
      <form id="todo-form" class="row" autocomplete="off">
        <input id="todo-input" type="text" maxlength="60" placeholder="할 일을 적고 Enter" />
        <button class="icon-btn small" type="submit" title="추가"><svg class="icon"><use href="#i-plus"/></svg></button>
      </form>
      <ul class="list" id="todo-list"></ul>
    </section>

    <section class="card" id="card-pomo">
      <header><svg class="icon"><use href="#i-timer"/></svg><h2>뽀모도로</h2><span class="muted" id="pomo-by"></span></header>
      <div class="pomo">
        <div class="gauge">
          <svg viewBox="0 0 120 120">
            <circle class="track" cx="60" cy="60" r="52"/>
            <circle class="fill" id="pomo-ring" cx="60" cy="60" r="52"/>
          </svg>
          <div class="gauge-text"><div id="pomo-time">25:00</div><div id="pomo-phase" class="muted">대기 중</div></div>
        </div>
        <div class="pomo-ctl">
          <p class="hint">25분 집중 · 5분 휴식 · 모두에게 공유</p>
          <button class="btn" id="btn-pomo"><svg class="icon"><use href="#i-play"/></svg><span>시작</span></button>
        </div>
      </div>
    </section>

    <section class="card" id="card-chat">
      <header><svg class="icon"><use href="#i-chat"/></svg><h2>채팅</h2></header>
      <div id="chat-log"></div>
      <form id="chat-form" class="row" autocomplete="off">
        <input id="chat-input" type="text" maxlength="200" placeholder="메시지 (Enter)" />
        <button class="icon-btn small" type="submit" title="보내기"><svg class="icon"><use href="#i-send"/></svg></button>
      </form>
    </section>
  </aside>

  <div id="login" class="modal" hidden>
    <form class="modal-box" id="login-form" autocomplete="off">
      <h1>📚 우리의 스터디룸</h1>
      <p class="muted">닉네임을 정하고 입장하세요. 문자·숫자·공백·_ - 12자 이내.</p>
      <input id="login-nick" type="text" maxlength="12" placeholder="닉네임" required />
      <div class="field">
        <label>셔츠 색</label>
        <div class="swatches" id="login-avatars"></div>
      </div>
      <p class="error" id="login-error" hidden></p>
      <button class="btn primary" type="submit" id="login-submit">입장</button>
    </form>
  </div>

  <div id="loading">불러오는 중…</div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/net.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/scenes/RoomScene.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
