services:
  - type: web
    name: null-study-meta
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: STORE
        value: ""
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: STATS_TZ
        value: Asia/Seoul
      - key: ROOM_PASSWORD
        sync: false
